<div class="app-shell">
  <app-toolbar
    class="app-shell__toolbar"
    [nameSchool]="nameSchool()"
    [username]="username()"
    [userRoleName]="userRoleName()"
    [isAdmin]="isAdmin()"
    [user]="user()"
    [sidenavOpened]="sidenav.opened"
    (toggleSidenav)="sidenav.toggle()"
  >
  </app-toolbar>

  <mat-sidenav-container class="app-shell__body" [hasBackdrop]="isMobile()">
    <mat-sidenav
      #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()"
      class="app-shell__sidenav"
    >
      <app-sidebar
        [mainMenus]="mainMenus()"
        [footerText]="footerText()"
        [isMobile]="isMobile()"
        [sidenavRef]="sidenav"
      >
      </app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="app-shell__content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
