<mat-menu #mobileActionsMenu="matMenu" panelClass="csa-menu csa-menu--mobile">

  <div class="mobile-menu-profile" (click)="$event.stopPropagation()">
    <div class="mobile-menu-avatar">
      <i class="fas fa-user-circle"></i>
    </div>
    <div>
      <div class="mobile-menu-username">{{ username() }}</div>
      <div class="mobile-menu-role">{{ userRoleName() }}</div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="mobile-menu-section-label" (click)="$event.stopPropagation()">
    <i class="fas fa-envelope"></i> Mensajes
  </div>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-inbox"></i>
    <span>Mensajes recibidos</span>
    <span class="menu-badge">7</span>
  </button>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-paper-plane"></i>
    <span>Mensajes enviados</span>
    <span class="menu-badge">3</span>
  </button>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-pen-to-square"></i>
    <span>Borradores</span>
    <span class="menu-badge">2</span>
  </button>

  <mat-divider></mat-divider>

  <div class="mobile-menu-section-label" (click)="$event.stopPropagation()">
    <i class="fas fa-bell"></i> Notificaciones
  </div>
  <button mat-menu-item>
    <i class="fas fa-user-graduate"></i>
    <span>Nuevo estudiante registrado</span>
  </button>
  <button mat-menu-item>
    <i class="fas fa-chalkboard-teacher"></i>
    <span>Clase reprogramada</span>
  </button>
  <button mat-menu-item>
    <i class="fas fa-calendar-days"></i>
    <span>Reunión de padres programada</span>
  </button>
  <button mat-menu-item>
    <i class="fas fa-triangle-exclamation"></i>
    <span>Incidencia en plataforma</span>
  </button>

  <mat-divider></mat-divider>

  <div class="mobile-menu-section-label" (click)="$event.stopPropagation()">
    <i class="fas fa-user"></i> Mi cuenta
  </div>
  <button mat-menu-item>
    <i class="fas fa-id-card"></i><span>Mi perfil</span>
  </button>
  <button mat-menu-item>
    <i class="fas fa-key"></i><span>Cambiar contraseña</span>
  </button>
  <button mat-menu-item (click)="toggleTheme()">
    <i class="fas fa-circle-half-stroke"></i><span>Cambiar tema</span>
  </button>
  <button mat-menu-item (click)="historial()">
    <i class="fas fa-clock-rotate-left"></i><span>Historial</span>
  </button>
  @if(isAdmin()){
  <button mat-menu-item (click)="company()">
    <i class="fas fa-building"></i>
    <span>Empresa</span>
  </button>
  }
  <button mat-menu-item (click)="help()">
    <i class="fas fa-circle-question"></i><span>Ayuda</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item class="menu-item--danger" (click)="logout()">
    <i class="fas fa-right-from-bracket"></i><span>Cerrar sesión</span>
  </button>
</mat-menu>

<mat-menu #messageMenu="matMenu" panelClass="csa-menu csa-menu--messages">
  <div class="menu-header-banner" (click)="$event.stopPropagation()">
    <i class="fas fa-envelope-open-text"></i>
    <span>Bandeja de entrada</span>
  </div>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-inbox"></i>
    <span>Mensajes recibidos</span>
    <span class="menu-badge">7</span>
  </button>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-paper-plane"></i>
    <span>Mensajes enviados</span>
    <span class="menu-badge">3</span>
  </button>
  <button mat-menu-item class="menu-item-counter">
    <i class="fas fa-pen-to-square"></i>
    <span>Borradores</span>
    <span class="menu-badge">2</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item class="menu-item-counter menu-item--all">
    <i class="fas fa-layer-group"></i>
    <span>Ver todos los mensajes</span>
    <span class="menu-badge menu-badge--navy">12</span>
  </button>
</mat-menu>

<mat-menu #menu="matMenu" panelClass="csa-menu">
  <button mat-menu-item (click)="settings()">

  </button>
  <button mat-menu-item (click)="toggleTheme()">

  <button mat-menu-item (click)="help()">

  </button>
</mat-menu>
