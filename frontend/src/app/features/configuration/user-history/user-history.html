<div class="container">
  <app-bread-crumb [items]="breadcrumbs()"></app-bread-crumb>

  <app-page-header [icon]="icon" [title]="title" [subtitle]="subtitle"> </app-page-header>

  <div class="row gx-3 gy-2 align-items-center mb-3">
    <!-- Buscador -->
    <div class="col-12 col-lg-5">
      <app-search
        [placeholder]="'Buscar por acción, módulo o descripción...'"
        (searchChange)="onSearch($event)"
      ></app-search>
    </div>

    <!-- Fechas -->
    <div class="col-12 col-lg-4">
      <div class="row gx-2 gy-2">
        <div class="col-12 col-sm-6">
          <mat-form-field appearance="outline" class="date-field w-100">
            <input
              matInput
              [matDatepicker]="fromPicker"
              placeholder="Desde"
              [ngModel]="dateFrom()"
              (ngModelChange)="onDateFromChange($event)"
            />
            <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
            <mat-datepicker #fromPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-12 col-sm-6">
          <mat-form-field appearance="outline" class="date-field w-100">
            <input
              matInput
              [matDatepicker]="toPicker"
              placeholder="Hasta"
              [ngModel]="dateTo()"
              (ngModelChange)="onDateToChange($event)"
            />
            <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
            <mat-datepicker #toPicker></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
    </div>

    <!-- Botones -->
    <div class="col-12 col-lg-3 d-flex gap-2">
      @if (dateFrom() || dateTo()) {
        <app-button
          class="flex-fill"
          label="Limpiar fechas"
          icon="close"
          variant="secondary"
          (clicked)="clearDateFilters()"
        ></app-button>
      }

      <app-button
        class="flex-fill"
        [label]="sort() === 'desc' ? 'Más reciente' : 'Más antiguo'"
        [icon]="sort() === 'desc' ? 'south' : 'north'"
        variant="secondary"
        (clicked)="toggleSortByDate()"
      ></app-button>
    </div>
  </div>
  <app-data-table [columns]="columns" [data]="logs()" [actions]="[]">
    <ng-template #cellTemplate let-column="column" let-value="value">
      @if (column === 'createdAt') {
        {{ value | date: 'dd/MM/yyyy HH:mm' }}
      } @else if (column === 'action') {
        <span class="action-badge">{{ value }}</span>
      } @else {
        {{ value }}
      }
    </ng-template>
  </app-data-table>

<app-pagination
  [totalItems]="totalItems()"
  [currentPage]="currentPage()"
  [pageSize]="pageSize()"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
</app-pagination>
</div>
