<div class="container">
  <app-page-header [icon]="icon" [title]="title" [subtitle]="subtitle"> </app-page-header>

  <div class="d-flex justify-content-end mb-3">
    <app-button label="Registrar" icon="add" variant="primary" class="register-btn"> </app-button>
  </div>
<app-data-table
  [columns]="columns"
  [data]="teacherContract()"
  (detail)="onDetail($event)"
  (download)="onDownload($event)"
  [actions]="tableActions"
>
</app-data-table>

  <app-pagination
    [totalItems]="totalItems()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
  </app-pagination>
</div>
