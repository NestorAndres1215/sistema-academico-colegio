<div class="container">
  <app-bread-crumb [items]="breadcrumbs()"></app-bread-crumb>
  <app-page-header [icon]="icon" [title]="title" [subtitle]="subtitle"></app-page-header>

  @if (user(); as adminData) {
    <div class="row g-4 mb-4 justify-content-center">
      <div class="col-12 col-md-6">
        <div class="profile-card">
          <div class="position-relative d-inline-block mb-3">
            <div class="logo-placeholder">{{ inicial }}</div>
          </div>

          <div class="divider"></div>
          <table class="table table-borderless table-sm mb-0 text-center profile-detail-table">
            <tbody>
              <tr>
                <td class="detail-label py-2">Username:</td>
                <td class="detail-value py-2">&#64;{{ adminData.username }}</td>
              </tr>
              <tr class="border-top">
                <td class="detail-label py-2">Correo:</td>
                <td class="detail-value py-2">{{ adminData.email }}</td>
              </tr>
              <tr class="border-top">
                <td class="detail-label py-2">Role:</td>
                <td class="detail-value py-2">{{ adminData.role }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  }
</div>
