<div class="forgot-password-page">
  <div class="forgot-password-card">
    <div class="forgot-password-header">
      <div class="forgot-password-logo">
        @if (logoUrl()) {
          <img [src]="logoUrl()" alt="Logo" class="logo-img" />
        } @else {
          <span class="logo-placeholder">{{ inicial }}</span>
        }
      </div>
      <h1 class="forgot-password-title">¿Tienes problemas para iniciar sesión?</h1>
      <p class="forgot-password-subtitle">
        Introduce tu correo electrónicoy te enviaremos un enlace para que vuelvas a entrar en tu
        cuenta.
      </p>
    </div>

    <form  [formGroup]="forgotForm" class="forgot-password-form">
      <div class="field-group">
        <label class="field-label">Correo electrónico</label>
        <mat-form-field appearance="outline" class="forgot-password-field">
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>
      </div>
      <app-button
        label="Enviar enlace"
        icon="fas fa-paper-plane"
        color="registrar"
        (click)="forgotPassword()"
      ></app-button>
    </form>
    <div class="back-link mt-3 text-center">
      <a (click)="goBack()">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
