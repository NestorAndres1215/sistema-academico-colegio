<div class="change-password-page">
  <div class="change-password-card">
    <div class="change-password-header">
      <div class="change-password-logo">
        @if (logoUrl()) {
          <img [src]="logoUrl()" alt="Logo" class="logo-img" />
        } @else {
          <span class="logo-placeholder">{{ inicial }}</span>
        }
      </div>
      <h1 class="change-password-title">Cambiar Contraseña</h1>
      <p class="change-password-subtitle">Introduce tu nueva contraseña para renovar</p>
    </div>

    <form [formGroup]="passwordForm" class="change-password-form">
      <div class="field-group">
        <label class="field-label"> Contraseña actual </label>
        <mat-form-field appearance="outline" class="field-input">
          <input
            matInput
            formControlName="currentPassword"
            [type]="showActual() ? 'text' : 'password'"
          />
          <button mat-icon-button matSuffix (click)="showActual.set(!showActual())">
            <mat-icon>{{ showActual() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <div class="field-group">
        <label class="field-label"> Nueva contraseña </label>
        <mat-form-field appearance="outline" class="field-input">
          <input
            matInput
            formControlName="newPassword"
            [type]="showNueva() ? 'text' : 'password'"
          />
          <button mat-icon-button matSuffix (click)="showNueva.set(!showNueva())">
            <mat-icon>{{ showNueva() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <div class="field-group">
        <label class="field-label"> Confirmar nueva contraseña </label>
        <mat-form-field appearance="outline" class="field-input">
          <input
            matInput
            formControlName="confirmNewPassword"
            [type]="showConfirmar() ? 'text' : 'password'"
          />
          <button mat-icon-button matSuffix (click)="showConfirmar.set(!showConfirmar())">
            <mat-icon>{{ showConfirmar() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </form>
  </div>
</div>
